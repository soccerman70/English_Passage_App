<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 펼친 단어장. 탭 아이콘은 16px 로 줄어드니 얇은 선 대신 굵은 면으로만 그린다.
       색은 앱 팔레트(global.css)의 primary(#0052ff), accent-yellow(#f4b000) 를 그대로 쓴다.
       주석에 하이픈 두 개를 연달아 쓰면 XML 파서가 거부하니 변수명은 풀어서 적는다. -->

  <!-- 타일 배경. 밝은 탭바와 어두운 탭바 양쪽에서 대비를 확보한다 -->
  <rect width="32" height="32" rx="7" fill="#0052ff"/>

  <!-- 좌우 페이지 -->
  <path fill="#ffffff" d="M16 12.2C13.6 10.6 10.4 9.9 6.8 10.1V21.7C10.4 21.5 13.6 22.2 16 23.8Z"/>
  <path fill="#ffffff" d="M16 12.2C18.4 10.6 21.6 9.9 25.2 10.1V21.7C21.6 21.5 18.4 22.2 16 23.8Z"/>

  <!-- 책등 — 배경색으로 홈을 파서 두 면이 갈라져 보이게 한다 -->
  <path stroke="#0052ff" stroke-width="1.8" stroke-linecap="round" d="M16 12.2V23.8"/>

  <!-- 책갈피 -->
  <path fill="#f4b000" d="M19.8 11.6H23.2V17.8L21.5 16.3L19.8 17.8Z"/>
</svg>
